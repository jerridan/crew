name: PR review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    types: [labeled]
  issue_comment:
    types: [created]
jobs:
  review:
    permissions:
      pull-requests: write
      checks: write
      contents: write
    uses: jerridan/pr-review/.github/workflows/review.yml@047fb726fe4f7cb50984e2d973048fc90e677cf7 # v0.21.0
    secrets: inherit
